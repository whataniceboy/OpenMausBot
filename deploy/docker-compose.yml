services:
  omb:
    build:
      context: .
      dockerfile: Dockerfile.gw
    image: openmausbot-py:local
    restart: unless-stopped
    init: true
    sysctls:
    - net.ipv6.conf.all.disable_ipv6=1
    extra_hosts:
    - host.docker.internal:host-gateway
    dns:
    - 223.5.5.5
    - 8.8.8.8
    shm_size: 512m
    mem_limit: 8g
    volumes:
    - data:/data
    - ./gai.conf:/etc/gai.conf:ro
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    - type: bind
      source: /data/shared-workspace
      target: /shared-workspace
    ports:
    - 80:80
    - 443:443
    environment:
      OMB_PORT: '8799'
      OMB_BROWSER_SANDBOX: '0'
      GATEWAY_URL: ${GATEWAY_URL:-}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      GATEWAY_AUTO_MODEL: ${GATEWAY_AUTO_MODEL:-}
      NODE_OPTIONS: --require=/data/.openmausbot/nov6.js
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OMB_WEBHOOK_PORT: '8800'
      OMB_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      OMB_PUBLIC_URL: https://${DOMAIN}
      OMB_SIGNIN_EMAILS: ${OMB_SIGNIN_EMAILS:-}
      OMB_SIGNIN_MEMBER_EMAILS: ${OMB_SIGNIN_MEMBER_EMAILS:-}
      OMB_VPS_DOCKER_HOST: unix:///var/run/docker.sock
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://127.0.0.1:8799/api/health | grep -q openmausbot
      interval: 30s
      timeout: 5s
      retries: 3
    group_add:
    - 988
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: service:omb
    depends_on:
      omb:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
volumes:
  data: null
  caddy_data: null
  caddy_config: null
